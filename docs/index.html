<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeScript コーディングテスト（ブラウザ版）</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #282840;
      --border: #3b3b5c;
      --text: #e0e0e0;
      --text-muted: #8888aa;
      --accent: #7c6ff7;
      --accent-light: #a08eff;
      --correct: #2ecc71;
      --wrong: #e74c3c;
      --code-bg: #1a1a2e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 18px;
      text-align: center;
    }

    #score-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 14px;
      color: var(--text-muted);
    }

    #score-bar .score {
      color: var(--accent-light);
      font-weight: bold;
    }

    .chapter-nav {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
    }

    .chapter-nav button {
      flex-shrink: 0;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .chapter-nav button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .chapter-nav button.done {
      border-color: var(--correct);
      color: var(--correct);
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(124, 111, 247, 0.08);
      border-bottom: 1px solid var(--border);
    }

    .question-header h3 {
      font-size: 15px;
    }

    .question-header .badge {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: bold;
    }

    .badge.correct { background: var(--correct); color: #fff; }
    .badge.wrong { background: var(--wrong); color: #fff; }
    .badge.pending { background: var(--border); color: var(--text-muted); }

    .question-body {
      padding: 12px 16px;
    }

    .question-body p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .question-body .hint {
      font-size: 12px;
      color: var(--accent-light);
      margin-bottom: 10px;
    }

    .code-editor {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      background: var(--code-bg);
      color: #c8d6e5;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      tab-size: 2;
    }

    .code-editor:focus {
      outline: none;
      border-color: var(--accent);
    }

    .question-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px 12px;
      gap: 8px;
    }

    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-run {
      background: var(--accent);
      color: #fff;
    }

    .btn-run:active { opacity: 0.8; }

    .btn-hint {
      background: transparent;
      color: var(--accent-light);
      border: 1px solid var(--accent-light);
      font-size: 12px;
      padding: 6px 12px;
    }

    .result-message {
      font-size: 13px;
      padding: 8px 16px 12px;
    }

    .result-message.correct { color: var(--correct); }
    .result-message.wrong { color: var(--wrong); }

    .summary-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-top: 24px;
      text-align: center;
    }

    .summary-section h2 { margin-bottom: 16px; }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
      text-align: left;
    }

    .summary-grid .item {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.03);
    }

    .hidden { display: none; }

    /* Tab support in textarea */
    .code-editor { white-space: pre; }
  </style>
</head>
<body>

<header>
  <h1>TypeScript コーディングテスト</h1>
  <div id="score-bar">
    <span>正解: <span class="score" id="total-correct">0</span></span>
    <span>/</span>
    <span>全 <span class="score" id="total-questions">100</span> 問</span>
  </div>
</header>

<nav class="chapter-nav" id="chapter-nav"></nav>

<main id="main-content"></main>

<script src="questions.js"></script>
<script src="app.js"></script>

</body>
</html>
